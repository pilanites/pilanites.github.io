<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ .Title }} · {{ .Site.Title }}</title>
    <link rel="canonical" href="{{ .Permalink }}">
    <style>body { max-width: 46rem; margin: 3rem auto; padding: 0 1.25rem; color: #252525; font: 18px/1.65 Georgia, serif; } a { color: #247ba0; }</style>
  </head>
  <body>
    <p><a href="/">PILANITES</a></p>
    <h1>{{ .Title }}</h1>
    <ul>
      {{ range .Pages.ByDate.Reverse }}
        <li><a href="{{ .RelPermalink }}">{{ .Title }}</a> <small>({{ .Date.Format "Jan 2, 2006" }})</small></li>
      {{ else }}
        <li>No new posts yet.</li>
      {{ end }}
    </ul>
  </body>
</html>
